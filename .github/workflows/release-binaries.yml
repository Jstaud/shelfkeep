name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: "Existing git tag to attach assets to (e.g. v1.0.0). Leave empty to only upload workflow artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
          - os: macos-latest
            artifact_os: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt

      - name: Build binary
        run: pyinstaller --noconfirm --clean packaging/shelfkeep.spec

      - name: Smoke-test the binary
        env:
          SHELFKEEP_USERNAME: admin
          SHELFKEEP_PASSWORD: testhook
          SESSION_SECRET: ci-binary-secret
        run: |
          ./dist/shelfkeep --version
          ./dist/shelfkeep version
          ./dist/shelfkeep --help

      - name: Archive
        id: archive
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) arch=x86_64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          stem="shelfkeep-${{ matrix.artifact_os }}-${arch}"
          chmod +x packaging/build_archive.sh
          packaging/build_archive.sh dist/shelfkeep "$stem"
          echo "stem=${stem}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.stem }}
          path: dist/${{ steps.archive.outputs.stem }}.tar.gz
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.event_name == 'push' || inputs.attach_to_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.attach_to_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name == 'push' }}
