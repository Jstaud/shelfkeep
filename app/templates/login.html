<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1008">
  <title>Sign in · Shelfkeep</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <div class="lamp"></div>
  <div class="login-card">
    <div class="brand login-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Shelfkeep</span>
    </div>
    <p class="lede">A private catalog for the things you keep — books on shelves, and the rest of the house beside them.</p>
    {% if error %}
      <p class="banner error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="stack">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" value="{{ default_user or '' }}" required>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary-btn">Open the door</button>
    </form>
    <p class="fineprint">Single-user local login. Change the default password in your environment file.</p>
  </div>
</body>
</html>
